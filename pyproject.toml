[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locklab"
version = "0.1.0"
description = "A reproducible experimentation framework for logic locking"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[project.scripts]
locklab = "locklab.__main__:main"

[tool.setuptools.packages.find]
include = ["locklab*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
